<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>homework41</title>
</head>

<body>
    <main>
        <form class="main_form">
            <h3 class="form_titel">Ваши личные данные</h3>
            <fieldset>
                <label for="">Ваше имя
                    <input class="input" name="name" type="text" placeholder="Имя" required>
                </label>
            </fieldset>
            <fieldset>
                <label for="">Ваш возраст
                    <input class="input" name="age" type="number" inputmode="numeric" placeholder="Возраст" required>
                </label>
            </fieldset>
            <fieldset>
                <label for="">Ваш номер телефона
                    <input class="input" name="tal" type="tel" inputmode="tel" placeholder="Номер телефона" required>
                </label>
            </fieldset>
            <fieldset>
                <label for="">Ваша почта
                    <input class="input" name="email" type="email" inputmode="email" placeholder="Почта" required>
                </label>
            </fieldset>
            <fieldset>
                Сообщение
                <textarea name="massege" id="" placeholder="Ваше Сообщение" required></textarea>
            </fieldset>
            <label class="checkbox" for="">
                <input type="checkbox" id="roundCheck" class="checkbox_input" >
                Я принимаю условия
            </label>
            <button>Отправить</button>
        </form>
    </main>
</body>

</html>
