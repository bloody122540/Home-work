<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0f1e" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Audio Rooms</title>

<!-- ===== PeerJS: jsDelivr (стабильнее в РФ) + локальный фолбэк ===== -->
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
:root{
  --bg:#f4f6fb; --card:#fff; --text:#0f172a; --muted:#64748b;
  --border:#e2e8f0; --input:#f8fafc;
  --primary:#4f46e5; --primary-h:#4338ca;
  --danger:#ef4444; --danger-h:#dc2626;
  --success:#10b981; --warning:#f59e0b;
  --shadow:0 8px 30px rgba(15,23,42,.08);
  --sa-t:env(safe-area-inset-top,0px);
  --sa-b:env(safe-area-inset-bottom,0px);
  --sa-l:env(safe-area-inset-left,0px);
  --sa-r:env(safe-area-inset-right,0px);
}
[data-theme="dark"]{
  --bg:#0a0f1e; --card:#131a2b; --text:#e8eefc; --muted:#8896b0;
  --border:#243049; --input:#1a2236;
  --primary:#7c74f5; --primary-h:#8f88ff;
  --danger:#f87171; --danger-h:#ef4444;
  --success:#34d399; --warning:#fbbf24;
  --shadow:0 8px 30px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{
  min-height:100vh; min-height:100dvh;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg); color:var(--text);
  transition:background .3s,color .3s;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
  overflow-x:hidden;
}
.wrap{
  min-height:100vh; min-height:100dvh;
  display:flex;
  padding:calc(20px + var(--sa-t)) calc(16px + var(--sa-r)) calc(20px + var(--sa-b)) calc(16px + var(--sa-l));
}
.screen{
  width:100%; max-width:440px; margin:auto;
  animation:up .35s cubic-bezier(.2,.9,.3,1.1);
}
.screen.hidden{display:none}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

.card{
  background:var(--card); border:1px solid var(--border);
  border-radius:20px; padding:28px 24px;
  box-shadow:var(--shadow);
  transition:background .3s,border-color .3s;
}
.card h1{font-size:22px;font-weight:700;margin-bottom:4px;letter-spacing:-.3px}
.card .sub{font-size:13px;color:var(--muted);margin-bottom:22px}

.field{margin-bottom:12px}
label{display:block;font-size:11px;font-weight:600;color:var(--muted);
  margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
input,select{
  width:100%;padding:11px 13px;
  font-size:16px;
  border:1.5px solid var(--border);border-radius:11px;
  background:var(--input);color:var(--text);
  outline:none;font-family:inherit;
  transition:border-color .15s,box-shadow .15s;
  -webkit-appearance:none;appearance:none;
  min-height:44px;
}
select{
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
                   linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%, calc(100% - 13px) 50%;
  background-size:5px 5px,5px 5px;
  background-repeat:no-repeat;
  padding-right:36px;
}
input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
input::placeholder{color:var(--muted);opacity:.7}
select:disabled{opacity:.55;cursor:not-allowed}

.btn{
  width:100%;padding:12px 18px;font-size:14px;font-weight:600;
  border:none;border-radius:11px;cursor:pointer;font-family:inherit;
  transition:all .18s;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;
  touch-action:manipulation;
  user-select:none;-webkit-user-select:none;
}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 14px rgba(79,70,229,.3)}
.btn-primary:hover:not(:disabled){background:var(--primary-h);transform:translateY(-1px)}
.btn-secondary{background:var(--input);color:var(--text);border:1.5px solid var(--border)}
.btn-secondary:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover:not(:disabled){background:var(--danger-h)}

.divider{display:flex;align-items:center;gap:10px;color:var(--muted);
  font-size:11px;margin:16px 0;text-transform:uppercase;letter-spacing:1.5px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}

.row{display:flex;gap:8px}
.row input{flex:1;min-width:0}
.row .btn{width:auto;padding:11px 18px;flex-shrink:0}

details.settings{
  background:var(--input);border:1.5px solid var(--border);
  border-radius:11px;padding:11px 13px;margin-bottom:12px;
}
details.settings summary{cursor:pointer;font-size:12px;font-weight:600;
  color:var(--muted);list-style:none;user-select:none;
  display:flex;align-items:center;gap:6px;min-height:24px}
details.settings summary::-webkit-details-marker{display:none}
details.settings summary::before{content:'⚙';transition:transform .2s}
details.settings[open] summary::before{transform:rotate(90deg)}
details.settings > div{margin-top:10px}

.rooms{margin-top:16px}
.rooms h3{font-size:11px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.rooms-list{display:flex;flex-direction:column;gap:6px;max-height:180px;overflow-y:auto;
  -webkit-overflow-scrolling:touch}
.room-item{display:flex;align-items:center;gap:10px;
  padding:10px 12px;background:var(--input);
  border:1.5px solid var(--border);border-radius:11px;
  cursor:pointer;transition:all .15s;touch-action:manipulation}
.room-item:hover{border-color:var(--primary);transform:translateX(2px)}
.room-ic{width:32px;height:32px;border-radius:9px;
  background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:13px;flex-shrink:0}
.room-info{flex:1;min-width:0}
.room-nm{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.room-meta{font-size:11px;color:var(--muted);font-family:monospace;margin-top:1px}
.room-del{background:none;border:none;color:var(--muted);cursor:pointer;
  font-size:14px;padding:6px 8px;border-radius:6px;font-family:inherit;flex-shrink:0}
.room-del:hover{color:var(--danger);background:rgba(239,68,68,.1)}
.empty{text-align:center;padding:16px;color:var(--muted);font-size:12px;
  background:var(--input);border-radius:11px;border:1.5px dashed var(--border)}

.error{color:var(--danger);font-size:12px;text-align:center;
  margin-top:10px;min-height:16px;font-weight:500}

/* ===== Комната ===== */
.room-hd{display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--border)}
.room-hd h2{font-size:17px;font-weight:700}
.room-id{font-size:12px;color:var(--muted);cursor:pointer;
  font-family:monospace;display:inline-flex;align-items:center;gap:5px;
  padding:5px 8px;border-radius:6px;transition:all .15s;touch-action:manipulation}
.room-id:hover{color:var(--primary);background:var(--input)}
.room-id::before{content:'#';opacity:.5}
.room-hd .btn{width:auto;padding:8px 14px;font-size:12px;min-height:38px}

.parts{display:flex;flex-direction:column;gap:7px;
  min-height:80px;max-height:340px;overflow-y:auto;margin-bottom:12px;
  -webkit-overflow-scrolling:touch}
.part{display:flex;align-items:center;gap:10px;
  padding:10px 12px;background:var(--input);
  border:1.5px solid var(--border);border-radius:12px;
  animation:in .25s ease-out;transition:all .2s}
@keyframes in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.part.you{background:rgba(79,70,229,.08);border-color:var(--primary)}
.part .av{width:38px;height:38px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:15px;flex-shrink:0;
  position:relative;text-transform:uppercase}
.part.host .av::after{content:'👑';position:absolute;top:-7px;right:-7px;font-size:11px}
.part-info{flex:1;min-width:0}
.part-nm{font-size:13.5px;font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.part-st{font-size:11px;color:var(--muted);display:flex;align-items:center;
  gap:5px;margin-top:1px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--success);
  display:inline-block;box-shadow:0 0 6px currentColor;color:var(--success)}
.dot.wait{background:var(--warning);color:var(--warning);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.footer{display:flex;align-items:center;justify-content:space-between;
  padding-top:12px;border-top:1px solid var(--border);
  font-size:12px;color:var(--muted);gap:10px;flex-wrap:wrap}
.counter{display:flex;align-items:center;gap:6px;font-weight:600}

/* Toast */
.toast{position:fixed;bottom:calc(22px + var(--sa-b));left:50%;
  transform:translateX(-50%) translateY(80px);
  padding:11px 20px;border-radius:11px;
  background:var(--card);border:1.5px solid var(--border);
  font-size:13px;font-weight:500;box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.2,.9,.3,1.1);
  z-index:200;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{border-color:var(--danger);color:var(--danger)}
.toast.success{border-color:var(--success);color:var(--success)}

.theme-btn{position:fixed;
  top:calc(16px + var(--sa-t));right:calc(16px + var(--sa-r));
  width:44px;height:44px;
  border-radius:12px;border:1.5px solid var(--border);
  background:var(--card);color:var(--text);font-size:18px;
  cursor:pointer;box-shadow:var(--shadow);transition:all .2s;
  z-index:100;display:flex;align-items:center;justify-content:center;
  touch-action:manipulation}
.theme-btn:hover{transform:translateY(-2px)}

.unlock-btn{
  position:fixed;left:50%;bottom:calc(78px + var(--sa-b));
  transform:translateX(-50%);
  display:none;align-items:center;gap:8px;
  padding:13px 22px;border-radius:999px;border:none;
  background:var(--primary);color:#fff;font-size:14px;font-weight:600;
  font-family:inherit;cursor:pointer;z-index:300;
  box-shadow:0 8px 26px rgba(79,70,229,.45);
  touch-action:manipulation;animation:up .3s;
}
.unlock-btn:active{transform:translateX(-50%) scale(.96)}

.spinner{width:15px;height:15px;border:2.5px solid rgba(255,255,255,.35);
  border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;
  display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

.invite{background:var(--input);border:1.5px solid var(--border);
  border-radius:11px;padding:10px 12px;margin-bottom:12px;font-size:11px}
.invite label{margin-bottom:6px;display:block}
.invite-row{display:flex;gap:6px;align-items:center}
.invite-row input{font-size:12px;padding:8px 10px;font-family:monospace;min-height:40px}
.invite-row button{width:auto;padding:8px 12px;font-size:11px;flex-shrink:0;min-height:40px}

.warn{background:rgba(245,158,11,.12);border:1.5px solid var(--warning);
  color:var(--warning);border-radius:11px;padding:10px 12px;
  font-size:12px;line-height:1.45;margin-bottom:12px;font-weight:500}

@media(max-width:480px){
  .card{padding:22px 18px;border-radius:18px}
  .card h1{font-size:19px}
  .room-hd h2{font-size:15px}
  .parts{max-height:none}
  .wrap{padding:calc(14px + var(--sa-t)) calc(12px + var(--sa-r)) calc(14px + var(--sa-b)) calc(12px + var(--sa-l))}
}
@media(max-height:520px){
  .parts{max-height:180px}
}
</style>
</head>
<body>

<!-- ===== Отладочный баннер: если что-то упадёт — увидишь это, а не белый экран ===== -->
<div id="__dbg" style="
  display:none;position:fixed;top:0;left:0;right:0;z-index:99999;
  background:#111;color:#0f0;font:12px/1.4 ui-monospace,monospace;
  padding:8px 10px;white-space:pre-wrap;max-height:40vh;overflow:auto;
  border-bottom:2px solid #f00;"></div>
<script>
  (function(){
    var box = document.getElementById('__dbg');
    function show(msg){
      box.style.display = 'block';
      box.textContent += msg + '\n';
    }
    window.addEventListener('error', function(e){
      show('❌ ' + (e.message||'error') + ' @ ' + (e.filename||'?') + ':' + (e.lineno||'?'));
    });
    window.addEventListener('unhandledrejection', function(e){
      var r = e.reason;
      show('❌ Promise: ' + (r && (r.message||r.type) ? (r.message||r.type) : r));
    });
    // Проверим, что PeerJS загрузился
    window.addEventListener('load', function(){
      if (typeof Peer === 'undefined'){
        show('❌ PeerJS не загрузился с jsDelivr. Проверьте интернет или положите peerjs.min.js рядом с index.html.');
      } else {
        // если всё ок — через 1 сек спрячем баннер
        setTimeout(function(){ if(box.textContent.trim()==='') box.style.display='none'; }, 1000);
      }
    });
  })();
</script>

<button class="theme-btn" id="themeBtn" title="Тема">🌙</button>

<div class="wrap">
  <!-- Лобби -->
  <section class="screen" id="lobby">
    <div class="card">
      <h1>🎙 Audio Rooms</h1>
      <p class="sub">До 5 участников · P2P · Без сервера</p>

      <div class="warn" id="secureWarn" style="display:none">
        ⚠️ Для доступа к микрофону нужен <b>HTTPS</b> (или localhost).
        Откройте страницу по защищённому адресу.
      </div>

      <div class="field">
        <label for="name">Ваше имя</label>
        <input id="name" type="text" placeholder="Введите имя" maxlength="20"
               autocomplete="off" autocapitalize="words" enterkeyhint="next" spellcheck="false">
      </div>

      <details class="settings">
        <summary>Настройки аудио</summary>
        <div>
          <div class="field">
            <label for="mic">Микрофон</label>
            <select id="mic"></select>
          </div>
          <div class="field" style="margin-bottom:0">
            <label for="spk">Динамик</label>
            <select id="spk"></select>
          </div>
        </div>
      </details>

      <button class="btn btn-primary" id="createBtn">➕ Создать комнату</button>

      <div class="divider">или</div>

      <div class="field">
        <label for="roomId">ID комнаты</label>
        <div class="row">
          <input id="roomId" type="text" placeholder="например abc-123" maxlength="40"
                 autocomplete="off" autocapitalize="off" autocorrect="off"
                 spellcheck="false" enterkeyhint="go" inputmode="latin">
          <button class="btn btn-secondary" id="joinBtn">Войти</button>
        </div>
      </div>

      <div class="rooms" id="roomsSection" style="display:none">
        <h3>Недавние комнаты</h3>
        <div class="rooms-list" id="roomsList"></div>
      </div>

      <div class="error" id="error"></div>
    </div>
  </section>

  <!-- Комната -->
  <section class="screen hidden" id="room">
    <div class="card">
      <div class="room-hd">
        <div>
          <h2>Комната</h2>
          <div class="room-id" id="roomIdShow" title="Нажмите, чтобы скопировать">
            <span id="roomIdTxt">—</span>
          </div>
        </div>
        <button class="btn btn-danger" id="leaveBtn">Выйти</button>
      </div>

      <div class="invite">
        <label>Ссылка для приглашения</label>
        <div class="invite-row">
          <input id="inviteLink" type="text" readonly>
          <button class="btn btn-secondary" id="copyLinkBtn">Копировать</button>
        </div>
      </div>

      <div class="parts" id="parts"></div>

      <div class="footer">
        <div class="counter">
          👥 <span id="count">0 / 5</span>
        </div>
        <div class="counter" id="statusWrap">
          <span class="dot wait"></span>
          <span id="statusTxt">Подключение...</span>
        </div>
      </div>
    </div>
  </section>
</div>

<button class="unlock-btn" id="unlockBtn">🔊 Включить звук</button>
<div class="toast" id="toast"></div>
<div id="audio" style="display:none"></div>

<script>
(function(){
  'use strict';

  /* ============ CONST ============ */
  const PREFIX = 'aroomv4-';
  const MAX = 5;
  const NAME_KEY = 'ar-name';
  const THEME_KEY = 'ar-theme';
  const ROOMS_KEY = 'ar-rooms';

  const CONNECT_TIMEOUT   = 15000;   // таймаут одной попытки открыть Peer
  const PEER_RETRIES      = 3;       // попыток подключения к сигнальному серверу
  const RETRY_DELAY       = 1500;    // мс между попытками
  const HOST_WAIT_TIMEOUT = 25000;   // сколько ждём ответа хоста в режиме клиента

  const COLORS = [
    'linear-gradient(135deg,#6366f1,#8b5cf6)',
    'linear-gradient(135deg,#06b6d4,#3b82f6)',
    'linear-gradient(135deg,#f59e0b,#ef4444)',
    'linear-gradient(135deg,#10b981,#06b6d4)',
    'linear-gradient(135deg,#ec4899,#8b5cf6)',
    'linear-gradient(135deg,#8b5cf6,#6366f1)',
    'linear-gradient(135deg,#ef4444,#f59e0b)'
  ];

  /* ============ STATE ============ */
  const S = {
    myId: null, myName: '', roomId: '',
    isHost: false, peer: null, localStream: null,
    calls: new Map(),
    conns: new Map(),
    peers: new Map(),
    hostId: null
  };

  /* ============ DOM ============ */
  const $ = id => document.getElementById(id);
  const lobby = $('lobby'), room = $('room');
  const nameEl = $('name'), roomIdEl = $('roomId');
  const micEl = $('mic'), spkEl = $('spk');
  const createBtn = $('createBtn'), joinBtn = $('joinBtn'), leaveBtn = $('leaveBtn');
  const errEl = $('error');
  const partsEl = $('parts'), countEl = $('count');
  const statusTxt = $('statusTxt'), statusWrap = $('statusWrap');
  const roomIdTxt = $('roomIdTxt'), roomIdShow = $('roomIdShow');
  const inviteLink = $('inviteLink'), copyLinkBtn = $('copyLinkBtn');
  const themeBtn = $('themeBtn'), toastEl = $('toast');
  const audioBox = $('audio');
  const roomsSection = $('roomsSection'), roomsList = $('roomsList');
  const unlockBtn = $('unlockBtn'), secureWarn = $('secureWarn');

  /* ============ UTIL ============ */
  const uid = (n=6) => {
    const c='abcdefghjkmnpqrstuvwxyz23456789';
    let s=''; for(let i=0;i<n;i++) s+=c[Math.floor(Math.random()*c.length)];
    return s;
  };
  const esc = s => { const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; };
  const colorOf = name => {
    let h=0; for(let i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))|0;
    return COLORS[Math.abs(h)%COLORS.length];
  };
  const peerIdFor = roomId => PREFIX + roomId.replace(/[^a-z0-9-]/gi,'').toLowerCase();

  let toastT;
  const toast = (msg, type='') => {
    toastEl.textContent = msg;
    toastEl.className = 'toast show ' + type;
    clearTimeout(toastT);
    toastT = setTimeout(() => toastEl.classList.remove('show'), 2600);
  };

  const setStatus = (txt, ok) => {
    statusTxt.textContent = txt;
    const d = statusWrap.querySelector('.dot');
    d.classList.toggle('wait', !ok);
  };

  async function copyText(text){
    try{
      if(navigator.clipboard && window.isSecureContext){
        await navigator.clipboard.writeText(text);
        return true;
      }
    }catch(e){}
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly','');
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, 99999);
      const ok = document.execCommand('copy');
      ta.remove();
      return ok;
    }catch(e){ return false; }
  }

  /* ============ БЕЗОПАСНЫЙ КОНТЕКСТ ============ */
  const isSecure = location.protocol === 'https:' ||
                   location.hostname === 'localhost' ||
                   location.hostname === '127.0.0.1' ||
                   location.hostname === '[::1]';
  const hasMedia = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  if(!isSecure || !hasMedia){
    secureWarn.style.display = 'block';
  }

  /* ============ РАЗБЛОКИРОВКА ЗВУКА ============ */
  let audioCtx = null;
  function ensureAudioCtx(){
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      if(!audioCtx) audioCtx = new AC();
      if(audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
    }catch(e){}
  }
  function setUnlock(show){ unlockBtn.style.display = show ? 'flex' : 'none'; }
  function checkAudioState(){

  function playAll(){
    audioBox.querySelectorAll('audio').forEach(a => {
      if(!a.srcObject) return;
      const p = a.play();
      if(p && p.catch) p.catch(()=>{});
    });
  }
  function unlockAudio(){
    ensureAudioCtx();
    playAll();
    setTimeout(checkAudioState, 350);

  ['pointerdown','touchend','click','keydown'].forEach(ev =>
    document.addEventListener(ev, unlockAudio, {passive:true})

    setTimeout(() => { if(unlockBtn.style.display !== 'none') toast('Нажмите ещё раз или проверьте громкость','error'); }, 500);

  /* ============ WAKE LOCK ============ */
  let wakeLock = null;
  async function requestWakeLock(){
    try{
      if('wakeLock' in navigator && document.visibilityState === 'visible'){

  /* ============ HISTORY ============ */

  /* ============ THEME ============ */
  (function(){
    const saved = localStorage.getItem(THEME_KEY);
    const dark = saved ? saved==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', dark?'dark':'light');

  /* ============ DEVICES ============ */
  async function loadDevices(){
    if(!hasMedia){
      micEl.innerHTML = '<option value="">Нет доступа</option>';
      spkEl.innerHTML = '<option value="default">Системный</option>';
      spkEl.disabled = true;
      return;
    }
    try{
      const t = await navigator.mediaDevices.getUserMedia({audio:true});
      t.getTracks().forEach(x=>x.stop());
      const devs = await navigator.mediaDevices.enumerateDevices();
      const mics = devs.filter(d=>d.kind==='audioinput');
      const spks = devs.filter(d=>d.kind==='audiooutput');
      micEl.innerHTML = mics.length
        ? mics.map((d,i)=>`<option value="${d.deviceId}">${esc(d.label||'Микрофон '+(i+1))}</option>`).join('')
        : '<option value="">Микрофон не найден</option>';
      const canSink = typeof HTMLMediaElement.prototype.setSinkId !== 'undefined';
      if(!spks.length || !canSink){
        spkEl.innerHTML = '<option value="default">Системный</option>';
        spkEl.disabled = true;
      }else{
        spkEl.innerHTML = spks.map((d,i)=>`<option value="${d.deviceId}">${esc(d.label||'Динамик '+(i+1))}</option>`).join('');
        spkEl.disabled = false;
      }
    }catch(e){
      micEl.innerHTML = '<option value="">Нет доступа</option>';
      spkEl.innerHTML = '<option value="default">Системный</option>';
      spkEl.disabled = true;
    }
  }
  if(navigator.mediaDevices?.addEventListener) navigator.mediaDevices.addEventListener('devicechange', loadDevices);

  async function getStream(){
    const id = micEl.value;
    const constraints = {
      audio: Object.assign(
        id ? {deviceId:{exact:id}} : {},
        {echoCancellation:true, noiseSuppression:true, autoGainControl:true}
      ),
      video:false
    };
    return navigator.mediaDevices.getUserMedia(constraints);
  }
  async function applySpeaker(){
    const id = spkEl.value;
    if(!id || typeof HTMLMediaElement.prototype.setSinkId === 'undefined') return;
    for(const a of audioBox.querySelectorAll('audio')){
      try{ await a.setSinkId(id); }catch(e){}
    }
  }
  spkEl.addEventListener('change', applySpeaker);

  /* ============ PEER ============ */
  const ICE = {
    iceServers: [
      {urls:'stun:stun.l.google.com:19302'},
      {urls:'stun:stun1.l.google.com:19302'},
      {urls:'stun:stun2.l.google.com:19302'},
      {urls:'stun:stun3.l.google.com:19302'},
      {urls:'stun:stun4.l.google.com:19302'},
      {urls:'stun:global.stun.twilio.com:3478'}
    ]
  };

  function openPeerOnce(id){
    return new Promise((resolve, reject) => {
      let done = false;
      let p = null;
      let timer = null;

      const finish = (ok, val) => {
        if(done) return;
        done = true;
        clearTimeout(timer);
        if(ok) return resolve(val);
        try{ if(p) p.destroy(); }catch(e){}
        reject(val);
      };

      if(typeof Peer === 'undefined'){
        return finish(false, Object.assign(new Error('PeerJS не загружен'), {type:'lib-not-loaded'}));
      }

      try{
        p = new Peer(id, { config: ICE, debug: 0 });
      }catch(e){
        return finish(false, e);
      }

      timer = setTimeout(
        () => finish(false, Object.assign(new Error('timeout'), {type:'timeout'})),
        CONNECT_TIMEOUT
      );

      p.on('open', pid => finish(true, { peer: p, id: pid }));
      p.on('error', err => finish(false, err || new Error('peer-error')));
    });
  }

  async function openPeer(id, onProgress){
    let lastErr = null;
    for(let i = 0; i < PEER_RETRIES; i++){
      if(i > 0 && typeof onProgress === 'function') onProgress(i + 1, PEER_RETRIES);
      try{
        return await openPeerOnce(id);
      }catch(e){
        lastErr = e;
        if(e && (e.type === 'unavailable-id' || e.type === 'invalid-id' || e.type === 'browser-incompatible')){
          throw e;
        }
        if(i < PEER_RETRIES - 1){
          await new Promise(r => setTimeout(r, RETRY_DELAY * (i + 1)));
        }
      }
    }
    throw lastErr || Object.assign(new Error('timeout'), {type:'timeout'});
  }

  function friendlyError(err){
    if(!err) return 'Ошибка подключения';
    const t = err.type || '';
    if(t === 'network' || t === 'socket-error' || t === 'socket-closed' || t === 'server-error')
      return 'Нет связи с сервером. Проверьте интернет.';
    if(t === 'unavailable-id') return 'Комната уже существует.';
    if(t === 'invalid-id')     return 'Некорректный ID комнаты.';
    if(t === 'browser-incompatible') return 'Браузер не поддерживается.';
    if(t === 'peer-unavailable')     return 'Комната не найдена.';
    if(t === 'lib-not-loaded')       return 'Библиотека не загрузилась. Обновите страницу.';
    if(t === 'timeout' || err.message === 'timeout')
      return 'Превышено время ожидания. Проверьте интернет и попробуйте снова.';
    return err.message || 'Ошибка подключения';
  }

  /* ============ ROOM LOGIC ============ */
  async function enter(roomId, tryHost, name){
    S.roomId = roomId; S.myName = name;
    S.peers.clear(); S.calls.clear(); S.conns.clear();

    try{ S.localStream = await getStream(); }
    catch(e){ throw new Error('Нет доступа к микрофону'); }

    let peer = null, myId = null, isHost = false;

    if(tryHost){
      try{
        const res = await openPeer(peerIdFor(roomId), (n, total) => {
          setStatus(`Подключение... попытка ${n}/${total}`, false);
        });
        peer = res.peer; myId = res.id; isHost = true;
      }catch(err){
        if(err && err.type === 'unavailable-id'){
          // комната уже есть — присоединимся как клиент
        } else {
          throw err;
        }
      }
    }

    if(!peer){
      const clientId = peerIdFor(roomId) + '-' + uid(8);
      const res = await openPeer(clientId, (n, total) => {
        setStatus(`Подключение... попытка ${n}/${total}`, false);
      });
      peer = res.peer; myId = res.id; isHost = false;
    }

    S.peer = peer; S.myId = myId; S.isHost = isHost;
    S.hostId = peerIdFor(roomId);
    S.peers.set(myId, {name, isHost, isYou:true});

    Hist.add(roomId);
    renderHistory();

    if(isHost) setupHost(); else setupClient();

    lobby.classList.add('hidden');
    room.classList.remove('hidden');
    roomIdTxt.textContent = roomId;
    inviteLink.value = location.origin + location.pathname + '?room=' + encodeURIComponent(roomId);
    document.title = 'Комната ' + roomId + ' — Audio Rooms';
    render();
    setStatus(isHost ? 'Комната создана' : 'Подключение...', isHost);

    requestWakeLock();
    unlockAudio();
  }

  function setupHost(){
    S.peer.on('connection', conn => {
      if(S.conns.size >= MAX-1){
        try{ conn.send({type:'full'}); }catch(e){}
        setTimeout(()=>{ try{conn.close()}catch(e){} }, 300);
        return;
      }
      conn.on('open', () => S.conns.set(conn.peer, conn));
      conn.on('data', data => {
        if(!data || !data.type) return;
        if(data.type==='hello'){
          if(data.name) addPeer(conn.peer, data.name, false);
          const list = [];
          S.peers.forEach((v,k)=>{ if(k!==conn.peer) list.push({id:k, name:v.name, isHost:v.isHost}); });
          try{ conn.send({type:'welcome', peers:list, hostId:S.myId}); }catch(e){}
          broadcastUpdate();
          render();
        }
      });
      conn.on('close', () => { S.conns.delete(conn.peer); removePeer(conn.peer, true); });
      conn.on('error', () => { S.conns.delete(conn.peer); removePeer(conn.peer, true); });
    });

    S.peer.on('call', call => {
      if(S.calls.has(call.peer)){ try{call.close()}catch(e){}; return; }
      try{ call.answer(S.localStream); }catch(e){}
      attachCall(call);
    });

    S.peer.on('disconnected', () => { setStatus('Переподключение...', false); try{S.peer.reconnect()}catch(e){} });
    S.peer.on('close', () => cleanup());
  }

  function setupClient(){
    S.peer.on('connection', conn => {
      conn.on('open', () => S.conns.set(conn.peer, conn));
      conn.on('data', data => {
        if(!data || !data.type) return;
        if(data.type==='welcome'){
          S.hostId = data.hostId || S.hostId;
          data.peers.forEach(p => {
            if(p.id===S.myId) return;
            if(p.id===S.hostId) S.peers.set(p.id,{name:p.name||'Хост',isHost:true});
            else addPeer(p.id, p.name, false);
            callPeer(p.id);
          });
          render();
          setStatus('В сети', true);
        }
        if(data.type==='update'){
          const incoming = new Map();
          data.peers.forEach(p => {
            if(p.id===S.myId) return;
            incoming.set(p.id, {name:p.name, isHost:p.isHost});
          });
          for(const id of Array.from(S.peers.keys())){
            if(id===S.myId) continue;
            if(!incoming.has(id)) removePeer(id, false);
          }
          incoming.forEach((info, id) => {
            if(!S.peers.has(id)){
              S.peers.set(id, info);
              callPeer(id);
            }else{
              S.peers.get(id).name = info.name;
              S.peers.get(id).isHost = info.isHost;
            }
          });
          render();
        }
        if(data.type==='peer-left'){ removePeer(data.id, false); }
        if(data.type==='host-closing'){ toast('Хост вышел', 'error'); setTimeout(()=>leave(true), 500); }
        if(data.type==='full'){ toast('Комната заполнена', 'error'); setTimeout(()=>leave(true), 600); }
      });
      conn.on('close', () => {
        S.conns.delete(conn.peer);
        if(conn.peer===S.hostId && !S.isHost){
          toast('Хост отключился', 'error');
          setTimeout(()=>leave(true), 500);
        }else removePeer(conn.peer, false);
      });
    });

    S.peer.on('call', call => {
      if(S.calls.has(call.peer)){ try{call.close()}catch(e){}; return; }
      try{ call.answer(S.localStream); }catch(e){}
      attachCall(call);
    });

    S.peer.on('disconnected', () => { setStatus('Переподключение...', false); try{S.peer.reconnect()}catch(e){} });
    S.peer.on('error', err => {
      if(err && err.type === 'peer-unavailable'){
        toast('Комната не найдена', 'error');
        setTimeout(()=>leave(true), 800);
      }
    });

    // ---- Подключение к хосту с ретраями ----
    let hostConnected = false;
    let retriesLeft = 2;
    let retryTimer = null;

    function scheduleHostRetry(){
      if(hostConnected || !S.peer || S.peer.destroyed) return;
      if(retriesLeft <= 0){
        toast('Комната не отвечает', 'error');
        setTimeout(()=>leave(true), 600);
        return;
      }
      retriesLeft--;
      setStatus('Повторное подключение...', false);
      clearTimeout(retryTimer);
      retryTimer = setTimeout(connectToHost, RETRY_DELAY);
    }

    function connectToHost(){
      if(hostConnected || !S.peer || S.peer.destroyed) return;
      let hostConn = null;
      try{ hostConn = S.peer.connect(S.hostId, {reliable:true}); }
      catch(e){ hostConn = null; }
      if(!hostConn){ scheduleHostRetry(); return; }

      hostConn.on('open', () => {
        hostConnected = true;
        S.conns.set(S.hostId, hostConn);
        try{ hostConn.send({type:'hello', name:S.myName}); }catch(e){}
        setStatus('В сети', true);
      });
      hostConn.on('error', err => {
        if(hostConnected) return;
        if(err && err.type === 'peer-unavailable'){
          toast('Комната не найдена', 'error');
          setTimeout(()=>leave(true), 800);
          return;
        }
        scheduleHostRetry();
      });
      hostConn.on('close', () => {
        if(!hostConnected){ scheduleHostRetry(); return; }
        S.conns.delete(S.hostId);
        if(!S.isHost){
          toast('Хост отключился', 'error');
          setTimeout(()=>leave(true), 500);
        }
      });
    }

    connectToHost();

    setTimeout(() => {
      if(!hostConnected && S.peers.size <= 1){
        scheduleHostRetry();
      }
    }, HOST_WAIT_TIMEOUT);
  }

  function addPeer(id, name, isHost){
    if(id===S.myId) return;
    if(S.peers.has(id)){
      S.peers.get(id).name = name || S.peers.get(id).name;
      S.peers.get(id).isHost = isHost;
      return;
    }
    S.peers.set(id, {name: name||'Участник', isHost: !!isHost});
  }

  function removePeer(id, fromHost){
    if(id===S.myId) return;
    if(S.calls.has(id)){ try{S.calls.get(id).close()}catch(e){}; S.calls.delete(id); }
    if(S.conns.has(id)){ try{S.conns.get(id).close()}catch(e){}; S.conns.delete(id); }
    const a = document.getElementById('a-'+id);
    if(a){ a.srcObject=null; a.remove(); }
    S.peers.delete(id);
    render();
    if(fromHost && S.isHost) broadcast({type:'peer-left', id});
  }

  function broadcast(msg){
    S.conns.forEach(c => { if(c && c.open){ try{c.send(msg)}catch(e){} } });
  }
  function broadcastUpdate(){
    const list = [];
    S.peers.forEach((v,k)=>{ if(k!==S.myId) list.push({id:k, name:v.name, isHost:v.isHost}); });
    broadcast({type:'update', peers:list});
  }

  function callPeer(id){
    if(!S.peer || !S.localStream) return;
    if(S.calls.has(id) || id===S.myId) return;
    try{
      const call = S.peer.call(id, S.localStream);
      if(call) attachCall(call);
    }catch(e){}
  }

  function attachCall(call){
    S.calls.set(call.peer, call);
    call.on('stream', stream => {
      let a = document.getElementById('a-'+call.peer);
      if(!a){
        a = document.createElement('audio');
        a.id = 'a-'+call.peer;
        a.autoplay = true;
        a.setAttribute('playsinline','');
        a.setAttribute('webkit-playsinline','');
        a.style.display = 'none';
        audioBox.appendChild(a);
      }
      a.srcObject = stream;
      const sid = spkEl.value;
      if(sid && typeof a.setSinkId === 'function') a.setSinkId(sid).catch(()=>{});
      a.play().then(()=>{ setUnlock(false); }).catch(()=>{ setUnlock(true); });
      render();
    });
    call.on('close', () => {
      S.calls.delete(call.peer);
      const a = document.getElementById('a-'+call.peer);
      if(a){ a.srcObject=null; a.remove(); }
      render();
    });
    call.on('error', () => { S.calls.delete(call.peer); });
  }

  /* ============ RENDER ============ */
  function render(){
    const arr = Array.from(S.peers.entries());
    arr.sort((a,b) => {
      const pa=a[1], pb=b[1];
      if(pa.isYou) return -1;
      if(pb.isYou) return 1;
      if(pa.isHost) return -1;
      if(pb.isHost) return 1;
      return (pa.name||'').localeCompare(pb.name||'');
    });

    if(!arr.length){
      partsEl.innerHTML = '<div class="empty">Ожидание участников...</div>';
      countEl.textContent = '0 / ' + MAX;
      return;
    }

    partsEl.innerHTML = arr.map(([id, p]) => {
      const online = p.isYou || S.calls.has(id) || S.conns.has(id);
      const cls = ['part'];
      if(p.isYou) cls.push('you');
      if(p.isHost) cls.push('host');
      const st = p.isYou ? 'Это вы' : (online ? 'В сети' : 'Подключение...');
      return `
        <div class="${cls.join(' ')}">
          <div class="av" style="background:${colorOf(p.name)}">${esc((p.name||'?')[0])}</div>
          <div class="part-info">
            <div class="part-nm">${esc(p.name)}${p.isYou?' <span style="color:var(--muted);font-weight:400">(вы)</span>':''}</div>
            <div class="part-st">
              <span class="dot ${online?'':'wait'}"></span>
              ${st}${p.isHost?' · Хост':''}
            </div>
          </div>
        </div>`;
    }).join('');
    countEl.textContent = arr.length + ' / ' + MAX;
  }

  /* ============ ENTRY ============ */
  async function startCreate(){
    errEl.textContent = '';
    const n = nameEl.value.trim();
    if(!n){ errEl.textContent='Введите имя'; nameEl.focus(); return; }
    const rid = uid(6) + '-' + uid(4);
    await doEnter(rid, true, n);
  }
  async function startJoin(){
    errEl.textContent = '';
    const n = nameEl.value.trim();
    const rid = roomIdEl.value.trim().toLowerCase();
    if(!n){ errEl.textContent='Введите имя'; nameEl.focus(); return; }
    if(!rid){ errEl.textContent='Введите ID'; roomIdEl.focus(); return; }
    if(!/^[a-z0-9-]+$/.test(rid)){ errEl.textContent='ID: только a-z, 0-9, -'; return; }
    await doEnter(rid, false, n);
  }
  async function doEnter(rid, tryHost, name){
    if(!hasMedia){
      errEl.textContent = 'Микрофон недоступен. Нужен HTTPS.';
      return;
    }
    createBtn.disabled = true; joinBtn.disabled = true;
    const btn = tryHost ? createBtn : joinBtn;
    const orig = btn.innerHTML;
    btn.innerHTML = '<span class="spinner"></span> Подключение...';
    localStorage.setItem(NAME_KEY, name);
    try{
      await enter(rid, tryHost, name);
    }catch(err){
      console.error(err);
      errEl.textContent = friendlyError(err);
      lobby.classList.remove('hidden');
      room.classList.add('hidden');
      document.title = 'Audio Rooms';
      cleanup();
    }finally{
      btn.innerHTML = orig;
      createBtn.disabled = false; joinBtn.disabled = false;
    }
  }

  /* ============ LEAVE ============ */
  function leave(silent){
    if(!silent){
      if(S.isHost) broadcast({type:'host-closing'});
      else if(S.conns.has(S.hostId)){ try{S.conns.get(S.hostId).close()}catch(e){} }
    }
    cleanup();
    room.classList.add('hidden');
    lobby.classList.remove('hidden');
    document.title = 'Audio Rooms';
    errEl.textContent = '';
    renderHistory();
  }
  function cleanup(){
    releaseWakeLock();
    if(S.localStream){ S.localStream.getTracks().forEach(t=>t.stop()); S.localStream=null; }
    S.calls.forEach(c=>{ try{c.close()}catch(e){} }); S.calls.clear();
    S.conns.forEach(c=>{ try{c.close()}catch(e){} }); S.conns.clear();
    if(S.peer){ try{S.peer.destroy()}catch(e){} S.peer=null; }
    S.peers.clear();
    audioBox.innerHTML = '';
    setUnlock(false);
    S.myId=null; S.roomId=''; S.isHost=false; S.hostId=null;
  }

  /* ============ COPY ============ */
  roomIdShow.addEventListener('click', async () => {
    const id = roomIdTxt.textContent;
    if(!id || id==='—') return;
    (await copyText(id)) ? toast('ID скопирован','success') : toast('Не удалось скопировать','error');
  });
  copyLinkBtn.addEventListener('click', async () => {
    const link = inviteLink.value;
    if(!link) return;
    (await copyText(link)) ? toast('Ссылка скопирована','success') : toast('Не удалось скопировать','error');
  });

  /* ============ INIT ============ */
  createBtn.addEventListener('click', startCreate);
  joinBtn.addEventListener('click', startJoin);
  leaveBtn.addEventListener('click', ()=>leave(false));
  nameEl.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); roomIdEl.focus(); } });
  roomIdEl.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); startJoin(); } });

  const savedName = localStorage.getItem(NAME_KEY);
  if(savedName) nameEl.value = savedName;
  nameEl.addEventListener('change', ()=> localStorage.setItem(NAME_KEY, nameEl.value.trim()));

  const urlR = new URLSearchParams(location.search).get('room');
  if(urlR) roomIdEl.value = urlR.toLowerCase();

  window.addEventListener('pagehide', () => { if(S.peer) cleanup(); });
  window.addEventListener('beforeunload', () => { if(S.peer) cleanup(); });
  document.addEventListener('keydown', e => {
    if(e.key==='Escape' && !room.classList.contains('hidden')) leave(false);
  });

  renderHistory();
  loadDevices();

  if(urlR && savedName){
    setTimeout(()=>{ startJoin(); }, 400);
  }else if(urlR){
    setTimeout(()=>toast('Введите имя и нажмите "Войти"'), 500);
  }
})();
</script>
</body>
</html>
